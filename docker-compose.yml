name: aiworld

x-backend-env: &backend-env
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiworld}:${POSTGRES_PASSWORD:-aiworld}@postgres:5432/${POSTGRES_DB:-aiworld}
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiworld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiworld}
      POSTGRES_DB: ${POSTGRES_DB:-aiworld}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build: ./backend
    <<: *backend-env
    command: ["sh", "scripts/migrate.sh"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  backend:
    build: ./backend
    <<: *backend-env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build: ./backend
    <<: *backend-env
    command: ["python", "-m", "app.scheduler.worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets OLLAMA_BASE_URL=http://host.docker.internal:11434 work on Linux too
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    # Scale out with: docker compose up --scale worker=3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    ports:
      - "3000:3000"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
