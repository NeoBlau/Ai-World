# Production overlay:  docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Only Caddy is exposed (80/443). Backend, frontend, Postgres and Redis stay on the internal network.
services:
  backend:
    ports: !reset []
    environment:
      ENVIRONMENT: production
  worker:
    environment:
      ENVIRONMENT: production
  migrate:
    environment:
      ENVIRONMENT: production
  frontend:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
